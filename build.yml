name: Build plugin

# Builds ClassicShop.jar (the /shop and /sell plugin in one jar) on GitHub's servers, no local setup needed.
# Run it from the Actions tab ("Run workflow") or just push to the repository,
# then download the "ClassicShop-jar" artifact from the finished run.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B package

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicShop-jar
          path: target/ClassicShop.jar
